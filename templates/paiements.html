{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-5">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="bi bi-cash-coin me-2"></i>Encaisser un Versement</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Sélectionner l'Élève *</label>
                        <select name="eleve_id" class="form-select" required>
                            <option value="" disabled selected>Choisir un élève...</option>
                            {% for e in eleves %}
                            <option value="{{ e.id }}">{{ e.nom_complet }} ({{ e.classe }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rubrique *</label>
                        <select name="rubrique_id" class="form-select" required>
                            <option value="" disabled selected>Choisir la rubrique...</option>
                            {% for r in rubriques %}
                            <option value="{{ r.id }}">{{ r.nom }} - {{ "{:,.0f}".format(r.montant_cdf) }} CDF</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Montant Payé (CDF) *</label>
                        <input type="number" step="500" name="montant_paye_cdf" class="form-control" placeholder="Ex: 150000" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mode de Règlement</label>
                        <select name="mode_paiement" class="form-select">
                            <option value="Cash">Cash / Espèces</option>
                            <option value="Mobile Money">Mobile Money (M-Pesa/Airtel/Orange)</option>
                            <option value="Banque">Virement BCDC/Rawbank</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100 btn-lg">
                        <i class="bi bi-printer me-2"></i>Valider & Imprimer Reçu POS
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Historique des Recettes</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Reçu</th>
                            <th>Élève</th>
                            <th>Motif</th>
                            <th>Montant</th>
                            <th>Ticket</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in paiements %}
                        <tr>
                            <td><small class="fw-bold">{{ p.num_recu }}</small></td>
                            <td>{{ p.eleve.nom_complet }}</td>
                            <td>{{ p.rubrique.nom }}</td>
                            <td class="text-success fw-bold">{{ "{:,.0f}".format(p.montant_paye_cdf) }} CDF</td>
                            <td>
                                <a href="{{ url_for('ticket_pos', paiement_id=p.id) }}" target="_blank" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-printer"></i>
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
