<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Élève - C.S. La Charité</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        input, select, button { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 8px; }
        button { background: #16a34a; color: white; border: none; font-weight: bold; cursor: pointer; padding: 12px; }
        .btn-back { display: inline-block; padding: 8px 14px; background: #e2e8f0; color: #334155; text-decoration: none; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="btn-back">⬅️ Retour au tableau de bord</a>

    <div class="box">
        <h2 style="margin-bottom: 15px;">Inscrire un nouvel élève</h2>
        <form method="POST">
            <label>Nom complet de l'élève</label>
            <input type="text" name="nom_complet" required placeholder="ex: MWANZA David">

            <label>Classe</label>
            <select name="classe">
                <option>1ère Maternelle</option>
                <option>2ème Maternelle</option>
                <option>1ère Primaire</option>
                <option>2ème Primaire</option>
                <option>7ème EB</option>
                <option>8ème EB</option>
                <option>1ère Humanité</option>
            </select>

            <label>Téléphone du Tuteur</label>
            <input type="text" name="telephone_tuteur" placeholder="ex: +243 81 000 0000">

            <label>Montant total des frais scolaires exigibles ($ ou FC)</label>
            <input type="number" step="0.01" name="frais_total" required placeholder="ex: 150">

            <button type="submit">Valider l'inscription</button>
        </form>
    </div>
</div>
</body>
</html>
